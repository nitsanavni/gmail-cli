[project]
name = "gmail-cli"
version = "0.1.0"
description = "CLI tool for reading, sending, and replying to Gmail - designed for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.22.0",
    "google-auth-oauthlib>=1.0.0",
    "html-to-markdown>=1.3.2,<2.0",
]

[project.scripts]
gmail-cli = "gmail_cli:main"
gmail = "gmail_cli:main"

[tool.pytest.ini_options]
# Modules live at the repo root, so tests under tests/ need it importable.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["account_commands", "auth", "calendar_commands", "commands", "docs_commands", "drive_commands", "gmail_cli", "guide_commands", "settings_commands"]
